[project]
name = "tux-ffb"
version = "0.1.0"
description = "Linux-native configurator for MOZA force-feedback flight bases"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Max Roberts" }]
keywords = ["moza", "flight-sim", "force-feedback", "ffb", "dcs", "falcon-bms"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Hardware :: Hardware Drivers",
]

# Core + CLI dependencies only. The GUI needs PyGObject/GTK4/libadwaita, which
# are distro packages, not wheels — see docs/01-architecture.md.
dependencies = [
  "pyserial>=3.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["PyGObject>=3.50"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
tux-ffb-cli = "tux_ffb.cli.main:main"

[project.gui-scripts]
tux-ffb = "tux_ffb.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tux_ffb"]

# The settings table lives outside the package so the docs can reference a
# stable path, but it must ship inside the wheel or an installed copy has no
# command table at all.
[tool.hatch.build.targets.wheel.force-include]
"data/protocol" = "tux_ffb/data/protocol"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
